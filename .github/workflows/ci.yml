name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: install codegen tools
        run: |
          go install go.uber.org/mock/mockgen@v0.6.0
          go install github.com/google/wire/cmd/wire@v0.7.0

      - name: go generate (no diff)
        run: |
          go generate ./...
          git diff --exit-code

      - name: gofmt (no diff)
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2.1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -race

      - name: docker build
        run: docker build .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: integration test
        run: go test -tags=integration -race ./...
